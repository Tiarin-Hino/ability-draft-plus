name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # NOTE: no separate `npm run prebuild` step. `prebuild` is an npm lifecycle
      # script, so `npm run build` runs it automatically — and a prebuild step
      # without this env block used to regenerate app-config.json with EMPTY
      # values right after the configured one wrote it, silently shipping a
      # build with no credentials. Keep the env on the step that builds.
      - run: npm run build
        env:
          API_ENDPOINT_URL: ${{ secrets.API_ENDPOINT_URL }}
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
          CLIENT_SHARED_SECRET: ${{ secrets.CLIENT_SHARED_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CLIENT_TAG: ${{ secrets.CLIENT_TAG }}
      - name: Ensure single draft release exists
        # Pre-creating a single draft release prevents electron-builder from racing
        # to create duplicate drafts (one holding only Setup.exe.blockmap).
        # If the tag already has a release, ensure it stays in draft mode first.
        run: |
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release edit "${{ github.ref_name }}" --draft
          } else {
            gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes ""
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: npx @sentry/cli sourcemaps upload --release="ability-draft-plus@${{ github.ref_name }}" ./out
