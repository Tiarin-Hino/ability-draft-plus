name: Twitch extension

on:
  push:
    branches: ['*']
    paths:
      - 'twitch/**'
      - 'src/shared/**'
      - 'src/core/stream/**'
      - 'src/core/domain/twitch-projection.ts'
      - 'resources/model/class_names.json'
      - 'resources/data/hero_meta.json'
      - '.github/workflows/twitch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'twitch/**'
      - 'src/shared/**'
      - 'src/core/stream/**'
      - 'src/core/domain/twitch-projection.ts'
      - 'resources/model/class_names.json'
      - 'resources/data/hero_meta.json'
      - '.github/workflows/twitch.yml'

concurrency:
  group: twitch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ebs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twitch/ebs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: twitch/ebs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twitch/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: twitch/catalog/package-lock.json
      - run: npm ci
      # Builds against dotaconstants master; fails on unlisted missing abilities/heroes
      - run: npm run build:demo
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: twitch/catalog/dist/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    needs: catalog
    defaults:
      run:
        working-directory: twitch/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: twitch/frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:geometry
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check bundle size (< 900 KB)
        run: |
          node -e "const fs=require('fs'),path=require('path');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).reduce((s,e)=>s+(e.isDirectory()?walk(path.join(d,e.name)):fs.statSync(path.join(d,e.name)).size),0);const bytes=walk('dist');console.log('dist bytes:',bytes);if(bytes>=921600)throw new Error('Twitch frontend dist exceeds 900 KB: '+bytes);"
      - uses: actions/upload-artifact@v4
        with:
          name: twitch-frontend-dist
          path: twitch/frontend/dist/
          retention-days: 14
