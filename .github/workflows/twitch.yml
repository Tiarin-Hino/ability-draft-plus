name: Twitch extension

on:
  push:
    branches: ['*']
    paths:
      - 'twitch/**'
      - 'src/shared/**'
      - 'src/core/stream/**'
      - 'src/core/domain/twitch-projection.ts'
      - 'resources/model/class_names.json'
      - 'resources/data/hero_meta.json'
      - '.github/workflows/twitch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'twitch/**'
      - 'src/shared/**'

jobs:
  ebs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twitch/ebs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twitch/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Builds against dotaconstants master; fails on unlisted missing abilities/heroes
      - run: npm run build:demo
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: twitch/catalog/dist/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    needs: catalog
    defaults:
      run:
        working-directory: twitch/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run gen:geometry
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: twitch-frontend-dist
          path: twitch/frontend/dist/
          retention-days: 14
