<!doctype html>
<!-- Platform-native follow/like rows (Instagram Reels, YouTube Shorts, TikTok), one band per state.
     Rendered by headless Chromium with --window-size=1080,2100, cropped/animated by make_native.py. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; background:transparent; }
  #stage { position:relative; width:1080px; height:1920px; background:transparent;
           font-family:"Liberation Sans","DejaVu Sans",Arial,Helvetica,sans-serif; color:#fff; }
  .row { position:absolute; left:40px; display:flex; align-items:center; gap:22px; height:110px; white-space:nowrap;
         text-shadow:0 1px 6px rgba(0,0,0,.8); }
  .av { width:84px; height:84px; border-radius:50%; flex:none; position:relative; }
  .av img { width:100%; height:100%; border-radius:50%; display:block; }
  .av.ig { padding:4px; background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); box-sizing:border-box; }
  .av.ig img { border:3px solid #111; box-sizing:border-box; }
  .av.tt img { border:3px solid #fff; box-sizing:border-box; }
  .badge { position:absolute; left:50%; bottom:-12px; transform:translateX(-50%); width:30px; height:30px; border-radius:50%;
           background:#fe2c55; color:#fff; font-size:26px; font-weight:700; line-height:30px; text-align:center; }
  .badge.check { font-size:20px; }
  .name { font-size:32px; font-weight:700; }
  .name.yt { font-weight:500; }
  .like { width:62px; height:62px; flex:none; margin:0 6px; filter:drop-shadow(0 1px 6px rgba(0,0,0,.8)); }
  .pill { height:64px; padding:0 30px; border-radius:32px; display:flex; align-items:center; font-size:30px; box-sizing:border-box; }
  .pill.ig { border:3px solid #fff; border-radius:18px; color:#fff; font-weight:500; background:rgba(0,0,0,.15); }
  .pill.yt-sub { background:#fff; color:#0f0f0f; font-weight:700; }
  .pill.yt-subd { background:rgba(255,255,255,.22); color:#fff; font-weight:500; }
</style></head>
