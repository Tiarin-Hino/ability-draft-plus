<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Served by stream-server-service over http://127.0.0.1:<port>/stream and rendered
      in OBS's browser source (CEF) — window.electronApi does NOT exist here.
      connect-src includes http://127.0.0.1:* for the dev-mode split origin (SPA on the
      vite dev server, SSE on the app's stream server).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*"
    />
    <title>Ability Draft Plus — Stream Board</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
